# Tham số node pose_estimator (camera3d_docking). Đơn vị: m, độ (deg) như tên tham số.
pose_estimator:
  ros__parameters:
    base_frame: base_link          # frame robot (REP-103: x tới, y trái, z lên)
    fixed_frame: odom              # frame cố định để lọc pose vật (vật đứng yên trong odom)
    template_path: euro_pallet.npz # tên file trong share/templates hoặc đường dẫn tuyệt đối
    cloud_stride: 2                # lấy mẫu thưa cloud organized (2 -> 1/4 số điểm)
    max_rate_hz: 10.0              # xử lý tối đa N khung/giây (máy yếu: 5)
    publish_rate_hz: 10.0          # tần số phát pose giữ (hold) khi mất dấu / vùng mù
    hold_timeout: 2.0              # giữ pose tối đa N giây sau phép đo cuối (ngoài vùng mù)
    blind_zone_distance: 0.6       # robot cách vật < N m: ngừng đo, chỉ giữ pose Kalman
    start_enabled: true            # false: chờ ~/enable (tiết kiệm CPU khi không docking)
    use_expected_pose: false       # true: dùng expected_pose làm pose khởi tạo
    expected_pose: [1.2, 0.0, 0.0] # [x, y, yaw_deg] của vật trong base_frame
    roi:
      min: [0.25, -1.5, 0.03]      # [x, y, z trên sàn] — z min cũng là ngưỡng xóa sàn
      max: [3.5, 1.5, 2.0]
    floor_z: 0.0                   # độ cao sàn trong base_frame (base_footprint: 0)
    floor_leveling: true           # tự sửa pitch/roll/độ cao camera theo mặt sàn (RANSAC)
    voxel_size: 0.02
    min_points_per_voxel: 1        # 2-3 để lọc nhiễu "flying pixels" của camera stereo
    nn_grid: true                  # lưới tra cứu tương ứng O(1) (nhanh hơn KD-tree)
    search:
      grid_res: 0.03
      yaw_range_deg: 45.0
      yaw_step_deg: 3.0
      n_bands: 3
      free_weight: 0.5
    icp:
      dof: xyz_yaw                 # xy_yaw | xyz_yaw | 6dof
      max_corr_dists: [0.15, 0.06, 0.03]
      min_observability: 0.008     # thấp hơn -> DEGENERATE (vật phẳng, thiếu đặc trưng)
    quality:
      min_coverage: 0.35
      min_inlier_ratio: 0.5
      max_rmse: 0.015
      max_sigma_xy: 0.02
      max_sigma_yaw_deg: 1.5
      ambiguity_ratio: 0.9
    kalman:
      q_xy: 0.005
      q_yaw_deg: 0.2
      gate_chi2: 14.16
      r_min_xy: 0.005
      r_min_yaw_deg: 0.3
    debug:
      publish_aligned_template: true
      publish_roi_cloud: false
